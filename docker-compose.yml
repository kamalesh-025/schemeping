services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-schemeping}
      MYSQL_USER: ${MYSQL_USER:-schemeping}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-schemeping}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-password-change-me}
    ports:
      # Host port is configurable because a local MySQL install often already
      # owns 3306. The container always listens on 3306 internally.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-before-any-real-deployment-000000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-1nS5NFwSoYVbHVFNZAdX-2L1B63shyOWmjn8b78mwG4=}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-schemeping}:${MYSQL_PASSWORD:-schemeping}@mysql:3306/${MYSQL_DATABASE:-schemeping}?charset=utf8mb4
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SEED_ON_START: ${SEED_ON_START:-false}
      # ---- authentication ----
      AUTH_MODE: ${AUTH_MODE:-password}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      # ---- messaging (Phase 5) ----
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-log}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
      META_WHATSAPP_API_VERSION: ${META_WHATSAPP_API_VERSION:-v22.0}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      MSG91_WHATSAPP_NUMBER: ${MSG91_WHATSAPP_NUMBER:-}
      MSG91_WHATSAPP_TEMPLATE_IDS: ${MSG91_WHATSAPP_TEMPLATE_IDS:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-change-me-whatsapp-webhook-secret}
      SEND_WHATSAPP_HOURLY_LIMIT: ${SEND_WHATSAPP_HOURLY_LIMIT:-10}
      SEND_NOTIFICATION_RETRIES: ${SEND_NOTIFICATION_RETRIES:-3}
      NOTIFICATIONS_SCHEDULE_ENABLED: ${NOTIFICATIONS_SCHEDULE_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else sys.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-before-any-real-deployment-000000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-1nS5NFwSoYVbHVFNZAdX-2L1B63shyOWmjn8b78mwG4=}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-schemeping}:${MYSQL_PASSWORD:-schemeping}@mysql:3306/${MYSQL_DATABASE:-schemeping}?charset=utf8mb4
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      # ---- messaging (Phase 5) ----
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-log}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
      META_WHATSAPP_API_VERSION: ${META_WHATSAPP_API_VERSION:-v22.0}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_WHATSAPP_NUMBER: ${MSG91_WHATSAPP_NUMBER:-}
      MSG91_WHATSAPP_TEMPLATE_IDS: ${MSG91_WHATSAPP_TEMPLATE_IDS:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-change-me-whatsapp-webhook-secret}
      SEND_WHATSAPP_HOURLY_LIMIT: ${SEND_WHATSAPP_HOURLY_LIMIT:-10}
      SEND_NOTIFICATION_RETRIES: ${SEND_NOTIFICATION_RETRIES:-3}
      NOTIFICATIONS_SCHEDULE_ENABLED: ${NOTIFICATIONS_SCHEDULE_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-before-any-real-deployment-000000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-1nS5NFwSoYVbHVFNZAdX-2L1B63shyOWmjn8b78mwG4=}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-schemeping}:${MYSQL_PASSWORD:-schemeping}@mysql:3306/${MYSQL_DATABASE:-schemeping}?charset=utf8mb4
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      # ---- messaging (Phase 5) ----
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-log}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_WHATSAPP_NUMBER: ${MSG91_WHATSAPP_NUMBER:-}
      MSG91_WHATSAPP_TEMPLATE_IDS: ${MSG91_WHATSAPP_TEMPLATE_IDS:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-change-me-whatsapp-webhook-secret}
      SEND_WHATSAPP_HOURLY_LIMIT: ${SEND_WHATSAPP_HOURLY_LIMIT:-10}
      SEND_NOTIFICATION_RETRIES: ${SEND_NOTIFICATION_RETRIES:-3}
      NOTIFICATIONS_SCHEDULE_ENABLED: ${NOTIFICATIONS_SCHEDULE_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:

      - field: state
        op: "=="
        value: Tamil Nadu
required_documents:
  - name: Ration card
  - name: Aadhaar cards of all family members
  - name: Income certificate
application_steps:
  - order: 1
    title: Check the family is on the list
    description: Search the ration card number on the scheme portal.
  - order: 2
    title: Get the smart card
    description: Collect the health insurance smart card at the e-Sevai centre.
  - order: 3
    title: Use it at network hospitals
    description: Show the card at the hospital help desk for cashless treatment.

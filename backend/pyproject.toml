[project]
name = "schemeping-backend"
version = "0.1.0"
description = "SchemePing API, eligibility engine, and seed pipeline"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "seed", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]
ignore = [
  "B008",  # FastAPI Depends() in defaults is idiomatic
  "RUF001", "RUF002", "RUF003",  # allow the rupee sign and Indian punctuation
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "sentry_sdk.*"]
ignore_missing_imports = true

# Tests are checked by ruff and executed by pytest; mypy's strictest flags are
# relaxed there so fixtures and parametrised cases stay readable.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a running MySQL instance",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app"]
